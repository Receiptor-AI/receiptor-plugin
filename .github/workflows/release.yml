name: Plugin release

on:
  pull_request:
  push:
    branches: [main, staging]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/release.py check
      - name: Require version bump for shipped changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/release.py check --base-ref "$BASE_SHA"
      - name: Check branch updates for reused versions
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python3 scripts/release.py check --base-ref "$BASE_SHA"
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/release.py build --preview
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-preview
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - run: python3 scripts/release.py build
      - name: Publish host archives from this tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS dist/release-info.json --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
